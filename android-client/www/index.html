<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ADT Monitoring</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #0f172a; color: #e2e8f0; text-align: center;
    }
    .card {
      width: 100%; max-width: 380px; background: #1e293b; border: 1px solid #334155;
      border-radius: 18px; padding: 28px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #f8fafc; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #94a3b8; }
    .btn {
      display: block; width: 100%; padding: 13px 16px; border-radius: 12px; border: 0;
      font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; margin-top: 10px;
    }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ADT Monitoring</h1>
    <p>Menghubungkan ke server pemantauan jaringan...</p>
    <a class="btn primary" href="https://monitoring.brayenkenzi.my.id/">Buka Dashboard Utama</a>
    <a class="btn secondary" href="http://10.10.10.7:8080/">Akses via LAN (10.10.10.7)</a>
  </div>
</body>
</html>
